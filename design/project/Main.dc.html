<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LIVE pads, playing with a queued clip</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fm1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="board">
<div class="x2">
<div class="scr">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Header" mode="LIVE" layer="PADS" state="play" bpm="124" pos="17.3" hint-size="240px,24px"></dc-import></div>
<div style="position: absolute; left: 0; top: 24px"><dc-import name="Knobs" spec="FILTER|LP 40|30|bi;SPACE|24%|24|;ECHO|0%|0|;DRIVE|12%|12|" hint-size="240px,48px"></dc-import></div>
<div style="position: absolute; left: 0; top: 74px"><dc-import name="PadGrid" grid="p,l,l,.,.,.,.|p,q,.,.,.|l,p,l,.,.,.,.|l,l,.,.,.|l,.,." focus="{{focus}}" progress="62" hint-size="240px,140px"></dc-import></div>
<div class="foot">
<div></div>
<div class="hint"><span class="kc">SCL</span>play</div>
</div>
</div>
</div>
<dc-import name="Keys" leds="pdd....pf...dpd....dd...d.." labels="A,B,C,D,E,F,G,A,B,C,D,E,A,B,C,D,E,F,G,A,B,C,D,E,A,B,C" zones="roles" hint-size="480px,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focus":{"editor":"int","default":1,"min":0,"max":4},"$preview":{"width":480,"height":632}}'>
class Component extends DCLogic {
  renderVals() {
    return { focus: this.props.focus ?? 1 };
  }
}
</script>
</body>
</html>
