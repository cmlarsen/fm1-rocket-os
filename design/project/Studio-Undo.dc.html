<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STUDIO undo toast</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fm1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="board">
<div class="x2">
<div class="scr">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Header" mode="STUDIO" layer="SONG" state="stop" bpm="124" pos="1.1" dirty="{{true}}" hint-size="240px,24px"></dc-import></div>
<div class="card" style="position: absolute; left: 3px; right: 3px; top: 27px; height: 44px; padding: 5px 7px; display: flex; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span class="m">Night Drive</span>
<span class="s" style="color: var(--mid)">C minor · 5 roles</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end">
<span class="m" style="color: var(--lead)">LEAD B</span>
<span class="s" style="color: var(--mid)">2 bars · loop</span>
</div>
</div>
<div style="position: absolute; left: 0; top: 74px"><dc-import name="PadGrid" grid="l,l,l,.,.,.,.|l,l,.,.,.|l,c,l,.,.,.,.|l,l,.,.,.|l,.,." focus="2" progress="0" hint-size="240px,140px"></dc-import></div>
<div class="toast" style="top: 184px; gap: 6px"><span class="cap" style="font-size: 10px; letter-spacing: 0.5px">undo</span><span>cleared LEAD B</span></div>
<div class="foot">
<div class="hint"><span class="kc">HOME</span>+<span class="kc">PLAY</span>redo</div>
</div>
</div>
</div>
<dc-import name="Keys" leds="..........................." zones="custom" zoneText="KEYS PLAY LEAD" zoneColor="var(--lead)" hint-size="480px,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":632}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
