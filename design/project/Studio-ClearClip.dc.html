<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STUDIO clear clip, hold to confirm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fm1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="board">
<div class="x2">
<div class="scr">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Header" mode="STUDIO" layer="SONG" state="stop" bpm="124" pos="1.1" dirty="{{true}}" hint-size="240px,24px"></dc-import></div>
<div style="position: absolute; left: 0; top: 74px; opacity: 0.25"><dc-import name="PadGrid" grid="l,l,l,.,.,.,.|l,l,.,.,.|l,c,l,.,.,.,.|l,l,.,.,.|l,.,." focus="2" progress="0" hint-size="240px,140px"></dc-import></div>
<div class="dlg" style="top: 40px; height: 140px; display: flex; align-items: center; gap: 12px; padding: 0 14px">
<div style="position: relative; width: 64px; height: 64px; flex: none">
<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="clear progress, about three quarters">
<circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="5"></circle>
<circle cx="32" cy="32" r="27" fill="none" stroke="var(--rec)" stroke-width="5" stroke-linecap="round" stroke-dasharray="127 170" transform="rotate(-90 32 32)"></circle>
</svg>
<span class="m" style="position: absolute; left: 0; right: 0; top: 23px; text-align: center; color: var(--lead)">B</span>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<span class="s cap" style="color: var(--rec); font-weight: 600">clear</span>
<span class="m">LEAD clip B</span>
<span class="s" style="color: var(--mid)">2 bars · 9 notes · 1 knob lane</span>
</div>
</div>
<div class="foot">
<div class="hint">release: keep</div>
<div class="hint"><span class="kc">HOME</span>+<span class="kc">REC</span>undo</div>
</div>
</div>
</div>
<dc-import name="Keys" leds=".............o............." labels=",,,,,,,,,,,,,B,,,,,,,,,,,,," zones="roles" hint-size="480px,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":632}}'>

</html>
