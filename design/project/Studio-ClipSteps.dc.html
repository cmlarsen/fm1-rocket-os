<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STUDIO clip editor, notes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fm1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="board">
<div class="x2">
<div class="scr">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Header" mode="STUDIO" layer="BASS B" state="play" bpm="124" pos="9.3" dirty="{{true}}" hint-size="240px,24px"></dc-import></div>
<div style="position: absolute; left: 0; top: 24px"><dc-import name="Knobs" spec="STEP|5/32|15|hot;NOTE|G1|40|;VEL|96|75|;LEN|1/8|25|" hint-size="240px,48px"></dc-import></div>
<div style="position: absolute; left: 3px; right: 3px; top: 75px; height: 116px; border-radius: 6px; background: var(--surf)">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="position: absolute; left: 22px; right: 2px; top: {{r.y}}px; height: 9px; background: {{r.bg}}"></div>
<span style="position: absolute; left: 3px; top: {{r.ly}}px; font-size: 9px; line-height: 10px; color: var(--mid)">{{r.label}}</span>
</sc-for>
<sc-for list="{{beats}}" as="b" hint-placeholder-count="4">
<div style="position: absolute; top: 2px; bottom: 2px; width: 1px; left: {{b.x}}px; background: var(--raise)"></div>
</sc-for>
<div style="position: absolute; top: 2px; bottom: 2px; width: 13px; left: {{playX}}px; background: var(--accent); opacity: 0.12"></div>
<div style="position: absolute; top: 2px; bottom: 2px; width: 13px; left: {{curX}}px; border: 1px solid var(--accent); border-radius: 2px; box-sizing: border-box"></div>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="8">
<div style="position: absolute; height: 7px; border-radius: 2px; top: {{n.y}}px; left: {{n.x}}px; width: {{n.w}}px; background: var(--bass)"></div>
</sc-for>
</div>
<div style="position: absolute; left: 25px; top: 195px; display: flex; gap: 1px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="16">
<div style="width: 12px; height: 6px; border-radius: 1px; background: {{s.bg}}"></div>
</sc-for>
</div>
<div class="foot">
<div class="hint">bar 1 of 2</div>
<div class="hint"><span class="kc">OCT+</span>next bar</div>
<div class="hint"><span class="kc">SEQ</span>page 2</div>
</div>
</div>
</div>
<dc-import name="Keys" leds="..............o............" labels=",,,,,,,,,,,,,,G,,,,,,,,,,,," zones="custom" zoneText="KEYS ENTER A NOTE AT THE CURSOR STEP" zoneColor="var(--bass)" hint-size="480px,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":632}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['D#2', 'D2', 'C#2', 'C2', 'B1', 'A#1', 'A1', 'G#1', 'G1', 'F#1', 'F1', 'E1'];
    const rows = names.map((label, i) => ({
      y: 4 + i * 9, ly: 4 + i * 9,
      label: (label === 'C2' || label === 'G1' || label === 'D#2') ? label : '',
      bg: label.indexOf('#') >= 0 ? 'transparent' : 'rgba(255,255,255,0.03)'
    }));
    const col = (s) => 24 + s * 13;
    const rowOf = (n) => names.indexOf(n);
    const notes = [[0, 'C2', 2], [3, 'C2', 1], [4, 'G1', 2], [7, 'A#1', 1], [8, 'C2', 2], [10, 'D#2', 1], [12, 'G1', 3], [15, 'F1', 1]]
      .map(([s, n, len]) => ({ x: col(s) + 1, y: 5 + rowOf(n) * 9, w: len * 13 - 2 }));
    const beats = [4, 8, 12].map((s) => ({ x: col(s) - 1 }));
    const filled = [0, 3, 4, 7, 8, 10, 12, 15];
    const steps = Array.from({ length: 16 }, (_, i) => ({
      bg: i === 4 ? 'var(--accent)' : filled.indexOf(i) >= 0 ? 'var(--bass)' : 'var(--raise)'
    }));
    return { rows, notes, beats, steps, playX: col(9), curX: col(4) };
  }
}
</script>
</body>
</html>
