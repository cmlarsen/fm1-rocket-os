<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LIVE takes list</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fm1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="board">
<div class="x2">
<div class="scr">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Header" mode="LIVE" layer="TAKE" state="stop" bpm="124" pos="1.1" hint-size="240px,24px"></dc-import></div>
<div class="card" style="position: absolute; left: 4px; right: 4px; top: 28px; height: 104px; padding: 6px 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span class="m">This song's take</span>
<span class="s num" style="color: var(--mid)">2:14 · 66 bars</span>
</div>
<div style="position: relative; margin-top: 6px; height: 68px">
<sc-for list="{{lanes}}" as="lane" hint-placeholder-count="5">
<div style="position: absolute; left: 0; right: 0; top: {{lane.y}}px; height: 9px; border-radius: 2px; background: var(--raise)">
<sc-for list="{{lane.segs}}" as="sg" hint-placeholder-count="3">
<div style="position: absolute; top: 0; height: 9px; border-radius: 2px; left: {{sg.x}}%; width: {{sg.w}}%; background: {{lane.color}}; opacity: {{sg.op}}"></div>
</sc-for>
</div>
</sc-for>
<svg width="208" height="12" viewBox="0 0 208 12" style="position: absolute; left: 0; top: 56px" role="img" aria-label="recorded filter knob movement">
<path d="M0 8 C20 8 30 2 50 3 S80 10 100 9 S140 2 160 4 S190 9 208 7" fill="none" stroke="var(--theme)" stroke-width="1.5"></path>
</svg>
</div>
</div>
<div style="position: absolute; left: 4px; right: 4px; top: 138px; display: flex; flex-direction: column; gap: 2px">
<div class="list-row on"><span class="m" style="font-size: 14px">Play the take</span><span class="kc" style="background: var(--ink); color: var(--sel)">SEL</span></div>
<div class="list-row"><span class="m" style="font-size: 14px">Clear</span><span class="s" style="color: var(--mid)">hold REC</span></div>
<div class="list-row"><span class="s" style="color: var(--mid)">recording again replaces it · undo restores</span></div>
</div>
<div class="foot">
<div class="hint"><span class="kc">SEL</span>play</div>
<div class="hint"><span class="kc">EDIT</span>back</div>
</div>
</div>
</div>
<dc-import name="Keys" leds="ddd....dd...ddd....dd...d.." labels="A,B,C,D,E,F,G,A,B,C,D,E,A,B,C,D,E,F,G,A,B,C,D,E,A,B,C" zones="roles" hint-size="480px,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":632}}'>
class Component extends DCLogic {
  renderVals() {
    const lanes = [
      { color: 'var(--drum)', segs: [[0, 40, 1], [40, 35, 0.55], [75, 25, 1]] },
      { color: 'var(--bass)', segs: [[12, 30, 1], [42, 58, 0.55]] },
      { color: 'var(--lead)', segs: [[25, 25, 0.55], [50, 38, 1]] },
      { color: 'var(--chord)', segs: [[40, 45, 1]] },
      { color: 'var(--fx)', segs: [[70, 6, 1], [88, 6, 1]] }
    ].map((l, i) => ({ y: i * 11, color: l.color, segs: l.segs.map(([x, w, op]) => ({ x, w, op })) }));
    return { lanes };
  }
}
</script>
</body>
</html>
