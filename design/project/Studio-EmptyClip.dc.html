</div>
</div>
</div>
<dc-import name="Keys" leds="..........................." zones="custom" zoneText="KEYS PLAY LEAD · REC STARTS ON THE NEXT BAR" zoneColor="var(--lead)" hint-size="480px,140px"></dc-import>
