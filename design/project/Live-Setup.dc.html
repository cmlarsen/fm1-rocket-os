<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LIVE setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fm1.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="board">
<div class="x2">
<div class="scr">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Header" mode="LIVE" layer="SETUP" state="play" bpm="124" pos="26.3" hint-size="240px,24px"></dc-import></div>
<div style="position: absolute; left: 4px; right: 4px; top: 28px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div class="{{r.cls}}">
<span class="m" style="font-size: 14px">{{r.label}}</span>
<span class="m" style="font-size: 14px; color: {{r.vc}}">{{r.value}}</span>
</div>
</sc-for>
</div>
<div class="foot">
<div class="hint"><span class="kc">SELECT</span>row</div>
<div class="hint"><span class="kc">ALGO</span>value</div>
<div class="hint"><span class="kc">EDIT</span>done</div>
</div>
</div>
</div>
<dc-import name="Keys" leds="pdd....dp...dpd....dd...d.." labels="A,B,C,D,E,F,G,A,B,C,D,E,A,B,C,D,E,F,G,A,B,C,D,E,A,B,C" zones="roles" hint-size="480px,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":632}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Assign keys', 'hold a key  ›'],
      ['Launch on', 'Next bar'],
      ['Stage lock', 'On'],
      ['External keys', 'Ch 1 · play'],
      ['Program change', 'Launch'],
      ['Take', '2:14  ›']
    ];
    const rows = data.map(([label, value], i) => ({
      label, value,
      cls: i === 1 ? 'list-row on' : 'list-row',
      vc: i === 1 ? 'var(--ink)' : 'var(--theme)'
    }));
    return { rows };
  }
}
</script>
</body>
</html>
